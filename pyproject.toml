[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmbench"
version = "0.1.0"
description = "Benchmark and profile quantized LLM inference: per-component GPU memory, latency and throughput."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch", "transformers", "accelerate"]

[project.optional-dependencies]
quant = ["bitsandbytes"]
dev = ["pytest"]

[project.scripts]
llmbench = "llmbench.cli:main"

[tool.setuptools]
packages = ["llmbench"]
